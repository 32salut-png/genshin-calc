  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2330;
      --border: #30363d; --accent: #58a6ff; --accent2: #bc8cff;
      --gold: #e3b341; --text: #e6edf3; --muted: #8b949e;
      --green: #3fb950; --red: #f85149; --orange: #d29922; --purple: #bc8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 80px; }
    .wrapper { max-width: 660px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.3em; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

    .mode-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .mode-tab { padding: 8px 4px; text-align: center; border-radius: 9px; cursor: pointer; font-size: 0.78em; font-weight: 700; color: var(--muted); transition: background 0.2s, color 0.2s; user-select:none; }
    .mode-tab.active { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .mode-tab .tab-icon { font-size: 1.1em; display: block; margin-bottom: 3px; }
    .mode-tab.active.tab-goal { border-color: var(--accent2); color: var(--accent2); }
    .mode-tab.active.tab-sim  { border-color: var(--gold); color: var(--gold); }
    .mode-tab.active.tab-mc   { border-color: var(--green); color: var(--green); }

    /* styles omitted for brevity - restored from commit */
  </style>
</head>
<body>
<div class="wrapper">
  <h1>✦ 原神 ガチャリソース計算機 Pro</h1>

  <div class="mode-tabs">
    <div class="mode-tab tab-mc active" onclick="switchMode('mc')"><span class="tab-icon">📊</span>モンテカルロ<br>確率</div>
    <div class="mode-tab tab-goal"      onclick="switchMode('goal')"><span class="tab-icon">🔢</span>必要原石<br>逆算</div>
    <div class="mode-tab tab-sim"       onclick="switchMode('sim')"><span class="tab-icon">🎲</span>排出<br>シミュレーション</div>
  </div>

  <!-- 共通：所持物 -->
  <div class="section">
    <div class="section-title">現在の所持物</div>
    <div class="inventory-grid">
      <div class="inv-item"><div class="inv-icon">💎</div><div class="inv-label">原石</div><input type="number" id="primogems" aria-label="原石" value="0" min="0" oninput="updateInventory()"><div class="inv-converted" id="conv-primo"></div></div>
      <div class="inv-item"><div class="inv-icon">⭐</div><div class="inv-label">スターライト</div><input type="number" id="starglitter" aria-label="スターライト" value="0" min="0" oninput="updateInventory()"><div class="inv-converted" id="conv-star"></div></div>
      <div class="inv-item"><div class="inv-icon">🎫</div><div class="inv-label">ガチャ石</div><input type="number" id="fates" aria-label="ガチャ石" value="0" min="0" oninput="updateInventory()"><div class="inv-converted" id="conv-fates"></div></div>
    </div>
    <div class="inv-total-row">
      <span class="inv-total-label">所持合計（ガチャ換算）</span>
      <span><span class="inv-total-val" id="invTotal">0.00</span><span class="inv-total-unit">連</span></span>
    </div>
  </div>

</div>
